<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClippyPlace - Realtime Pixel Canvas</title>
    <!-- Favicon SVG oficial -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            background: #1f2833;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #66fcf1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        h1 {
            font-size: 20px;
            color: #66fcf1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            font-size: 14px;
            color: #c5c6c7;
            font-weight: normal;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #coords {
            font-family: monospace;
            font-size: 14px;
            color: #45a29e;
            background: #0b0c10;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #1f2833;
        }

        #stats {
            font-family: monospace;
            font-size: 13px;
            color: #fe1a93;
        }

        #viewport {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0b0c10;
            cursor: grab;
        }

        #viewport:active {
            cursor: grabbing;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            background: #ffffff;
        }

        .bottom-bar {
            width: 100%;
            background: #1f2833;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #2b2d31;
            z-index: 10;
            flex-wrap: wrap;
        }

        .palette {
            display: flex;
            gap: 6px;
            align-items: center;
            background: #0b0c10;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #45a29e;
        }

        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.selected {
            border-color: #ffffff;
            transform: scale(1.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        #cooldown-box {
            font-size: 14px;
            font-weight: bold;
            color: #66fcf1;
            background: #0b0c10;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #45a29e;
            min-width: 160px;
            text-align: center;
        }

        .zoom-controls {
            display: flex;
            gap: 5px;
        }

        .zoom-btn {
            background: #45a29e;
            color: #0b0c10;
            border: none;
            font-weight: bold;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .zoom-btn:hover {
            background: #66fcf1;
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .discord-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>📎 ClippyPlace <span>| Lienzo Colaborativo</span></h1>
        <div class="header-info">
            <span id="stats">Píxeles: --</span>
            <div id="coords">X: 0 | Y: 0</div>
            <!-- Reemplazar el href con la invitación de tu servidor cuando lo crees -->
            <a href="#" target="_blank" class="discord-btn" id="discordLink">💬 Discord</a>
        </div>
    </header>

    <div id="viewport">
        <canvas id="placeCanvas" width="500" height="500"></canvas>
    </div>

    <div class="bottom-bar">
        <div class="palette" id="palette">
            <!-- Colores dinámicos -->
            <input type="color" id="customColor" value="#fe0000" title="Color personalizado">
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" id="btnZoomIn" title="Acercar">+</button>
            <button class="zoom-btn" id="btnZoomOut" title="Alejar">-</button>
            <button class="zoom-btn" id="btnReset" title="Centrar lienzo">🎯</button>
        </div>

        <div id="cooldown-box">¡Listo para pintar!</div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = "https://mlcxhwecenrzljbvjwfw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_cCEnniqUtH84Aw8Ye2rgiQ_SkbaAY2w";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('placeCanvas');
        const ctx = canvas.getContext('2d');
        const coordsBox = document.getElementById('coords');
        const statsBox = document.getElementById('stats');
        const cooldownBox = document.getElementById('cooldown-box');
        const customColorInput = document.getElementById('customColor');

        const GRID_SIZE = 100; // Lienzo de 100x100 píxeles
        const PIXEL_SIZE = canvas.width / GRID_SIZE; // 5px por píxel interno

        let scale = 1.2;
        let panX = (viewport.clientWidth - canvas.width * scale) / 2;
        let panY = (viewport.clientHeight - canvas.height * scale) / 2;
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let totalPixelsPainted = 0;

        const COLORES = [
            '#000000', '#ffffff', '#7e7e7e', '#fe0000', 
            '#fe8a00', '#fefe00', '#00fe00', '#00b2fe', 
            '#0000fe', '#a200fe', '#fe1a93', '#8b4513'
        ];

        let colorActual = COLORES[3]; // Rojo por defecto
        let enCooldown = false;
        let tiempoCooldown = 5; // 5 segundos de cooldown

        // Renderizar Paleta
        const paletteContainer = document.getElementById('palette');
        COLORES.forEach((col) => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${col === colorActual ? 'selected' : ''}`;
            btn.style.backgroundColor = col;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                colorActual = col;
            });
            paletteContainer.insertBefore(btn, customColorInput);
        });

        customColorInput.addEventListener('input', (e) => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            colorActual = e.target.value;
        });

        // Transformar vista (Zoom / Pan)
        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            canvas.style.transformOrigin = '0 0';
        }

        updateTransform();

        // Arrastrar mapa (Pan)
        viewport.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !e.shiftKey) {
                isDragging = true;
                dragStartX = e.clientX - panX;
                dragStartY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX = e.clientX - dragStartX;
                panY = e.clientY - dragStartY;
                updateTransform();
            } else {
                const rect = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (PIXEL_SIZE * scale));
                const y = Math.floor((e.clientY - rect.top) / (PIXEL_SIZE * scale));

                if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                    coordsBox.innerText = `X: ${x} | Y: ${y}`;
                }
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Zoom con rueda del ratón
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 0.1;
            if (e.deltaY < 0) {
                scale = Math.min(scale + zoomFactor, 5);
            } else {
                scale = Math.max(scale - zoomFactor, 0.5);
            }
            updateTransform();
        });

        // Botones Zoom
        document.getElementById('btnZoomIn').onclick = () => { scale = Math.min(scale + 0.3, 5); updateTransform(); };
        document.getElementById('btnZoomOut').onclick = () => { scale = Math.max(scale - 0.3, 0.5); updateTransform(); };
        document.getElementById('btnReset').onclick = () => {
            scale = 1.2;
            panX = (viewport.clientWidth - canvas.width * scale) / 2;
            panY = (viewport.clientHeight - canvas.height * scale) / 2;
            updateTransform();
        };

        // Pintar píxel en el lienzo
        function pintarPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }

        // Cargar Base de datos
        async function cargarLienzo() {
            const { data } = await supabaseClient.from('pixels').select('*');
            if (data) {
                data.forEach(p => pintarPixel(p.x, p.y, p.color));
                totalPixelsPainted = data.length;
                statsBox.innerText = `Píxeles: ${totalPixelsPainted}`;
            }
        }

        // Escuchar Tiempo Real (WebSockets)
        supabaseClient
            .channel('public:pixels')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pixels' }, payload => {
                const p = payload.new;
                if (p) {
                    pintarPixel(p.x, p.y, p.color);
                    if (payload.eventType === 'INSERT') {
                        totalPixelsPainted++;
                        statsBox.innerText = `Píxeles: ${totalPixelsPainted}`;
                    }
                }
            })
            .subscribe();

        // Evento de Click para Pintar
        let clickStartX = 0, clickStartY = 0;
        canvas.addEventListener('mousedown', (e) => {
            clickStartX = e.clientX;
            clickStartY = e.clientY;
        });

        canvas.addEventListener('click', async (e) => {
            if (Math.abs(e.clientX - clickStartX) > 5 || Math.abs(e.clientY - clickStartY) > 5) return;
            if (enCooldown) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / (PIXEL_SIZE * scale));
            const y = Math.floor((e.clientY - rect.top) / (PIXEL_SIZE * scale));

            if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                pintarPixel(x, y, colorActual);
                await supabaseClient.from('pixels').upsert({ x, y, color: colorActual });
                iniciarCooldown();
            }
        });

        function iniciarCooldown() {
            enCooldown = true;
            let restante = tiempoCooldown;
            cooldownBox.style.color = '#fe1a93';
            
            const timer = setInterval(() => {
                cooldownBox.innerText = `Espera: ${restante}s`;
                restante--;
                if (restante < 0) {
                    clearInterval(timer);
                    enCooldown = false;
                    cooldownBox.innerText = '¡Listo para pintar!';
                    cooldownBox.style.color = '#66fcf1';
                }
            }, 1000);
        }

        cargarLienzo();
    </script>
</body>
</html>

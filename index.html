<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClippyPlace - Realtime Pixel Canvas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            margin-bottom: 15px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #5865f2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #canvas-container {
            border: 3px solid #2b2d31;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: #ffffff;
            cursor: crosshair;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1e1f22;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #2b2d31;
        }

        .palette {
            display: flex;
            gap: 6px;
        }

        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.selected {
            border-color: #ffffff;
            transform: scale(1.15);
        }

        #cooldown-box {
            font-size: 14px;
            font-weight: bold;
            color: #5865f2;
            min-width: 110px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>📎 ClippyPlace</h1>
    </header>

    <div id="canvas-container">
        <canvas id="placeCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="palette" id="palette"></div>
        <div id="cooldown-box">¡Listo para pintar!</div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Reemplaza con tus llaves)
        const SUPABASE_URL = "https://mlcxhwecenrzljbvjwfw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_cCEnniqUtH84Aw8Ye2rgiQ_SkbaAY2w";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const canvas = document.getElementById('placeCanvas');
        const ctx = canvas.getContext('2d');
        const cooldownBox = document.getElementById('cooldown-box');

        const GRID_SIZE = 100; // Lienzo de 100x100 píxeles
        const PIXEL_SIZE = canvas.width / GRID_SIZE; // 4px por píxel

        const COLORES = [
            '#000000', '#ffffff', '#7e7e7e', '#bebebe',
            '#fe0000', '#fe1a93', '#fe8a00', '#fefe00',
            '#00fe00', '#00b2fe', '#0000fe', '#a200fe'
        ];

        let colorActual = COLORES[0];
        let enCooldown = false;
        let tiempoCooldown = 10; // Segundos entre píxeles

        // Dibujar Paleta de Colores
        const paletteContainer = document.getElementById('palette');
        COLORES.forEach((col, index) => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${index === 0 ? 'selected' : ''}`;
            btn.style.backgroundColor = col;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                colorActual = col;
            });
            paletteContainer.appendChild(btn);
        });

        // Pintar un Píxel en Canvas
        function pintarPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }

        // Cargar Estado Inicial desde Supabase
        async function cargarLienzo() {
            const { data, error } = await supabaseClient.from('pixels').select('*');
            if (data) {
                data.forEach(p => pintarPixel(p.x, p.y, p.color));
            }
        }

        // Suscribirse a Cambios en Tiempo Real
        supabaseClient
            .channel('public:pixels')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pixels' }, payload => {
                const p = payload.new;
                if (p) pintarPixel(p.x, p.y, p.color);
            })
            .subscribe();

        // Evento de Click en el Lienzo
        canvas.addEventListener('click', async (e) => {
            if (enCooldown) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);

            // Pintar Localmente
            pintarPixel(x, y, colorActual);

            // Enviar a Supabase
            await supabaseClient.from('pixels').upsert({ x, y, color: colorActual });

            // Iniciar Cooldown
            iniciarCooldown();
        });

        function iniciarCooldown() {
            enCooldown = true;
            let restante = tiempoCooldown;
            cooldownBox.style.color = '#fe1a93';
            
            const timer = setInterval(() => {
                cooldownBox.innerText = `Espera: ${restante}s`;
                restante--;
                if (restante < 0) {
                    clearInterval(timer);
                    enCooldown = false;
                    cooldownBox.innerText = '¡Listo para pintar!';
                    cooldownBox.style.color = '#5865f2';
                }
            }, 1000);
        }

        cargarLienzo();
    </script>
</body>
</html>
